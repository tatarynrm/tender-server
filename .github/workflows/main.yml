name: Deploy NEST.js

# Автодеплой на push вимкнено: тепер прод розкочується командою /deploy в
# Telegram-боті (scripts/deploy.sh), яка оновлює бекенд і фронт разом і не
# рестартує pm2, якщо збірка впала. Два механізми на один каталог конфліктували б.
#
# Лишено ручний запуск як запасний хід на випадок, коли бот недоступний:
# Actions -> Deploy NEST.js -> Run workflow.
#
# Оновлює ТІЛЬКИ бекенд. Фронт цим шляхом не чіпається — для нього є /deploy.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Server code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            export NVM_DIR="/root/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd /rtdata/tender/tender-server
            git reset --hard HEAD
            git pull origin main
            npm install 
            npm run build
            pm2 restart tender-server || pm2 start npm --name tender-server -- run start
